<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — faeridoodles</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff0f6;
    --ink:#5c2a4d;
    --ink-dim:#945b81;
    --accent:#ff4fa3;
    --accent-text:#c13c7b;
    --violet:#ff85c0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    padding:2rem;
  }
  .code{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(4rem, 18vw, 9rem);
    color:var(--accent);
    text-shadow:3px 3px 0 var(--violet);
    line-height:1;
  }
  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(1.4rem, 4vw, 2rem);
    margin-top:1rem;
  }
  p{
    color:var(--ink-dim);
    max-width:40ch;
    margin:1rem auto 2rem;
  }
  a.home-link{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color:#fff0f6;
    background:var(--accent-text);
    text-decoration:none;
    padding:0.8rem 1.6rem;
    border-radius:28px;
    box-shadow:0 8px 20px rgba(255,79,163,0.3);
  }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page wandered off the canvas.</h1>
  <p>The page you're looking for doesn't exist — but there's plenty of art to see back home.</p>
  <a class="home-link" href="/">Back to the gallery</a>
</body>
</html>
